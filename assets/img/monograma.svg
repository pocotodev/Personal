  <rect x="8.5" y="8.5" width="103" height="103" fill="none" stroke="#D19443" stroke-width="0.5" opacity="0.55"/>
  <!-- Losango ornamental no topo e na base -->
  <path d="M60 12.5 63.5 16 60 19.5 56.5 16Z" fill="#D19443"/>
  <path d="M60 100.5 63.5 104 60 107.5 56.5 104Z" fill="#D19443"/>
